<title>ORLEX · Fuar Kayıt</title>

<style>
:root{
  --navy:#0D3981; --navy-d:#0A2C64; --orange:#EF7B00; --orange-d:#D06A00;
  --paper:#fff; --ground:#EBEFF6; --line:#D3DCEA; --line-s:#E7ECF4;
  --ink:#13203A; --muted:#65728D;
  --ok:#127A4B;
  --r:10px;
  --fs: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--fs); background:var(--ground); color:var(--ink);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:0;
}
body.hasbar{padding-bottom:130px}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ---------- header ---------- */
.top{
  background:var(--paper); border-bottom:1px solid var(--line);
  padding:14px 20px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  position:sticky; top:0; z-index:20;
}
.top img{height:34px;width:auto;display:block}
.fair{margin-left:auto;display:flex;align-items:center;gap:9px;min-width:0}
.fair span{color:var(--muted);font-size:13px;white-space:nowrap}
.fair input,.fair select{
  border:1px solid var(--line); border-radius:var(--r); padding:9px 12px;
  background:var(--paper); min-width:170px; max-width:280px; font-size:15px;
  min-height:42px;
}
.fair select{cursor:pointer}
.fair input:focus,.fair select:focus{border-color:var(--navy)}
.fair select.err,.fair input.err{border-color:#C0261B;background:#FFF7F6}

/* ---------- record strip ---------- */
.strip{
  background:var(--navy); color:#fff; padding:13px 20px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.count{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.count b{font-weight:600}
.count i{font-style:normal;opacity:.55;font-weight:400;padding:0 3px}
.stamp{font-size:13px;color:#B7C6E4;font-variant-numeric:tabular-nums;text-align:right}
.stamp{margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:#5FD39B;flex:none}
.dot.busy{background:var(--orange)}

/* ---------- sheet ---------- */
.sheet{background:var(--paper);border-bottom:1px solid var(--line)}
.grid{padding:6px 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.f{padding-top:16px}
.f.wide{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.in{
  width:100%; border:1px solid var(--line); border-radius:var(--r);
  padding:14px 14px; min-height:52px; background:#FBFCFE; font-size:17px;
}
.in:focus{background:#fff;border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
textarea.in{min-height:78px;resize:vertical;line-height:1.4}
.name .in{font-size:20px;font-weight:600;min-height:58px}

.sep{grid-column:1/-1;border-top:1px solid var(--line-s);margin-top:20px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.chip{
  border:1px solid var(--line); background:#FBFCFE; border-radius:999px;
  padding:11px 16px; font-size:15px; cursor:pointer; color:var(--ink);
}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  border:1px solid var(--line);background:#FBFCFE;border-radius:var(--r);
  padding:12px 18px;font-size:15px;cursor:pointer;flex:1;min-width:96px;
}
.seg button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}

.warn{
  grid-column:1/-1;margin-top:14px;background:#FFF4E6;border:1px solid #FBD9AC;
  border-radius:var(--r);padding:11px 14px;font-size:14px;color:#7A4A05;
}

/* ---------- empty ---------- */
.empty{padding:64px 24px;text-align:center;background:var(--paper);border-bottom:1px solid var(--line)}
.empty p{color:var(--muted);margin:0 0 20px}

/* ---------- bottom bar ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);
  border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(13,57,129,.09);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));
}
.new{
  width:100%;min-height:60px;border-radius:var(--r);cursor:pointer;
  background:var(--orange);border:1px solid var(--orange);
  color:#fff;font-weight:600;font-size:18px;
}
.new:disabled{cursor:default}
.new:active{background:var(--orange-d)!important}
button.wide{
  width:100%;margin-top:10px;min-height:54px;border-radius:var(--r);cursor:pointer;
  background:var(--paper);border:1.5px solid var(--navy);color:var(--navy);
  font-size:17px;font-weight:600;
}
button.wide:active{background:#F2F6FC}
.new.done{background:#F3F5F9!important;border-color:var(--line)!important;color:var(--muted)!important;font-weight:500!important;cursor:default}
.sub{display:flex;gap:14px;align-items:center;margin-top:11px;font-size:14px}
.sub button{background:none;border:none;padding:6px 2px;color:var(--navy);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sub .sp{margin-left:auto;flex:1}

/* ---------- overlay ---------- */
.row{display:flex;align-items:center;gap:14px;padding:17px 20px;border-bottom:1px solid var(--line-s);cursor:pointer;width:100%;text-align:left}
.row:hover{background:#F6F8FC}
.rowdel{
  flex:none;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);
  padding:10px 14px;font-size:14px;color:#8A1C12;cursor:pointer;
}
.psum{padding:11px 20px;background:#F6F8FC;border-bottom:1px solid var(--line-s);font-size:14px;color:var(--muted);display:flex;gap:14px}
.psum b{color:var(--ink);font-weight:600}
.psum .e{color:#8A1C12}
.row.cur{background:#F0F4FB;box-shadow:inset 4px 0 0 var(--orange)}
.num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;min-width:26px}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .when{font-size:13px;color:#8A94A9;font-variant-numeric:tabular-nums;margin-top:2px}
.tag{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--ground);color:var(--muted);flex:none}
.tag.s{background:#FDEBD6;color:#8A5200}
.del{padding:34px 20px;text-align:center;color:var(--muted)}
/* zorunlu alan durumu */
.req{color:var(--orange);margin-left:3px;font-weight:600}
.opt{color:var(--muted);font-weight:400}
.in.err{border-color:#C0261B;background:#FFF7F6;box-shadow:inset 0 0 0 1px #C0261B}
.mark{outline:2px solid #C0261B;outline-offset:7px;border-radius:var(--r)}
.errbar{
  grid-column:1/-1;margin-top:16px;background:#FCEAE7;border:1px solid #F0B4AD;
  border-radius:var(--r);padding:13px 15px;font-size:15px;color:#8A1C12;
}
.errbar b{font-weight:600}
.dot.err{background:#FF9086}
.tag.e{background:#FCEAE7;color:#8A1C12}

/* ---------- ekranlar ---------- */
.screen{display:none}
.screen.on{display:block}
.back{
  margin-left:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 18px;font-size:15px;color:var(--navy);cursor:pointer;font-weight:500;min-height:44px;
}
.back:active{background:#F2F6FC}

/* ---------- ana sayfa ---------- */
.hwrap{max-width:620px;margin:0 auto;padding:26px 20px 40px}
.hfair{margin-bottom:24px}
.hfair label{font-size:14px;margin-bottom:8px}
.tile{
  display:block;width:100%;text-align:left;cursor:pointer;margin-bottom:14px;
  background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:24px 26px;
}
.tile b{display:block;font-size:23px;font-weight:600;color:var(--navy);margin-bottom:5px}
.tile span{display:block;font-size:15px;color:var(--muted)}
.tile:active{transform:translateY(1px)}
.tile.p{background:var(--orange);border-color:var(--orange)}
.tile.p b{color:#fff}
.tile.p span{color:#FFE6CC}
.hstat{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted);padding:8px 4px}
.ver{font-size:12px;color:#98A2B5;padding:2px 4px 0;font-variant-numeric:tabular-nums}
.off{background:#FFF4E6;border:1px solid #FBD9AC;color:#7A4A05;border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:16px}
.toast{
  background:#E9F6EF;border:1px solid #A8DCC2;color:#0E5C39;border-radius:var(--r);
  padding:13px 16px;font-size:15px;margin-bottom:18px;
}

/* ---------- form üst şeridi ---------- */
.strip .stitle{font-size:18px;font-weight:600}
.mini{display:flex;align-items:center;gap:7px;color:var(--muted)}

/* ---------- kayıtlar ekranı ---------- */
#listscreen .ps{background:var(--paper);border-bottom:1px solid var(--line-s);padding:14px 20px}
#listscreen .ps .in{margin-bottom:10px}
#listscreen .ps .in:last-child{margin-bottom:0}
.flab{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}
.ghead{
  padding:11px 20px;background:#F0F4FB;border-bottom:1px solid var(--line-s);
  font-size:13px;font-weight:600;color:var(--navy);position:sticky;top:0;
}
#listscreen .plist{background:var(--paper);min-height:40vh}
#listscreen .psum .sp{margin-left:auto}

@media (max-width:720px){
  .grid{grid-template-columns:1fr}
  .top{gap:12px}
  .fair{margin-left:0;width:100%}
  .fair input{flex:1;max-width:none}
  .strip{top:auto;position:static}
  .top{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

        <input class="in" id="mail" data-k="mail" type="email" inputmode="email" autocapitalize="off" autocomplete="off">
      </div>

      <div class="f wide">
        <label for="unvan">Görev <span class="opt">— isteğe bağlı</span></label>

      <div id="dupe" class="warn" hidden></div>

      <div class="sep"></div>
      <div class="f wide">
        <label>İlgilendiği ürünler<span class="req">*</span></label>
        <div class="chips" id="chips"></div>
      </div>

      <div class="f wide">
        <label for="not">Notlar <span class="opt">— isteğe bağlı</span></label>

  <div class="bar">

      <button id="del">Bu kaydı sil</button>

</section>

<!-- ============ KAYITLAR ============ -->
<section class="screen" id="listscreen">
  <div class="ps">
    <label for="ffilter" class="flab">Fuar</label>
    <select class="in" id="ffilter"></select>
    <input class="in" id="q" placeholder="İsim, firma, ülke, telefon ara" autocomplete="off">
  </div>
  <div class="psum">
    <span><b id="s1">0</b> kayıt</span>
    <span class="e" id="s2" hidden></span>
    <span class="sp" id="s3"></span>
  </div>
  <div class="plist" id="plist"></div>
  <div class="bar">
    <button class="wide" id="csv">Excel'e aktar</button>
  </div>
</section>
<script>
(function(){
"use strict";

var KEY = "orlex_fuar_kayit";
var SURUM = "1.0";
var URUNLER = ["Bel / korse","Diz","Ayak bileği","El bileği","Dirsek","Omuz","Boyunluk","Tabanlık","Atel","Bandaj","Çocuk ürünleri","Hasta bakım"];

var ULKELER = ["Türkiye","Almanya","ABD","Birleşik Krallık","Fransa","İtalya","İspanya","Hollanda","Belçika","Avusturya","İsviçre","Polonya","Çekya","Slovakya","Macaristan","Romanya","Bulgaristan","Yunanistan","Sırbistan","Hırvatistan","Slovenya","Bosna-Hersek","Karadağ","Kuzey Makedonya","Arnavutluk","Kosova","Portekiz","İrlanda","Danimarka","İsveç","Norveç","Finlandiya","İzlanda","Estonya","Letonya","Litvanya","Ukrayna","Rusya","Belarus","Moldova","Gürcistan","Ermenistan","Azerbaycan","Kazakistan","Özbekistan","Türkmenistan","Kırgızistan","Tacikistan","KKTC","Suudi Arabistan","Birleşik Arap Emirlikleri","Katar","Kuveyt","Bahreyn","Umman","Yemen","Irak","İran","Ürdün","Lübnan","Suriye","İsrail","Filistin","Mısır","Libya","Tunus","Cezayir","Fas","Sudan","Etiyopya","Kenya","Tanzanya","Uganda","Ruanda","Nijerya","Gana","Senegal","Fildişi Sahili","Kamerun","Kongo","Angola","Zambiya","Zimbabve","Mozambik","Güney Afrika","Namibya","Botsvana","Madagaskar","Mauritius","Somali","Cibuti","Çin","Hindistan","Pakistan","Bangladeş","Sri Lanka","Nepal","Japonya","Güney Kore","Tayvan","Hong Kong","Singapur","Malezya","Endonezya","Tayland","Vietnam","Filipinler","Kamboçya","Myanmar","Moğolistan","Afganistan","Avustralya","Yeni Zelanda","Kanada","Meksika","Brezilya","Arjantin","Şili","Kolombiya","Peru","Ekvador","Bolivya","Paraguay","Uruguay","Venezuela","Kosta Rika","Panama","Guatemala","Dominik Cumhuriyeti","Küba","Diğer"];

/* Fuar listesi. Kendi takviminize göre satır ekleyip çıkarın. */
var FUARLAR = [
  "Expomed Eurasia — İstanbul",
  "MEDICA — Düsseldorf",
  "Arab Health — Dubai",
  "REHACARE — Düsseldorf",
  "FIME — Miami",
  "Hospitalar — São Paulo",
  "Medical Fair Asia — Singapur",
  "Africa Health — Johannesburg",
  "Medic East Africa — Nairobi",
  "KIMES — Seul",
  "CMEF — Şanghay",
  "Zdravookhraneniye — Moskova",
  "Iran Health — Tahran",
  "TOTBİD Kongresi"
];

/* Zorunlu alanlar. Bir alanı isteğe bağlı yapmak için satırını sil. */
var ZORUNLU = [
  {k:"ad",    ad:"Ad soyad"},
  {k:"cins",  ad:"Cinsiyet"},
  {k:"firma", ad:"Firma"},
  {k:"ulke",  ad:"Ülke / şehir"},
  {k:"tel",   ad:"Telefon"},
  {k:"mail",  ad:"E-posta"},
  {k:"urun",  ad:"İlgilendiği ürünler"}
];

/* --- depolama: hem cihaza hem buluta yazar, hangisi yeniyse onu okur --- */
var UZAK = !!(typeof window !== "undefined" && window.storage && window.storage.get);
var YEREL = (function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } })();

function yerelOku(){ try{ var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function yerelYaz(v){ if(!YEREL) return false; try{ localStorage.setItem(KEY, JSON.stringify(v)); return true; }catch(e){ return false; } }
function uzakOku(){
  if(!UZAK) return Promise.resolve(null);
  return window.storage.get(KEY).then(function(r){ return r && r.value ? JSON.parse(r.value) : null; }).catch(function(){ return null; });
}

var db = { fair:"", records:[], rev:0 };
var idx = -1, timer = null, dirty = false, uzakBekliyor = false, tekrar = null;
var snap = "";                                   /* kaydedilen son hâl */
function degisti(){ var r = cur(); return r ? JSON.stringify(r) !== snap : false; }
function damgala(){ var r = cur(); snap = r ? JSON.stringify(r) : ""; }
var $ = function(id){ return document.getElementById(id); };

function blank(){
  return { id: Date.now()+"-"+Math.random().toString(36).slice(2,7), ad:"", cins:"", firma:"", unvan:"", ulke:"", sehir:"", tel:"", mail:"", urun:[], not:"", fuar:db.fair, ts:new Date().toISOString(), kayitTs:"", guncelTs:"" };
}
function tarihStr(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function saatStr(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
}
function uzunTarih(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"long",year:"numeric"}) + " · " + saatStr(iso);
}
function cur(){ return idx>=0 ? db.records[idx] : null; }
function isEmpty(r){ return r && !r.ad && !r.cins && !r.firma && !r.tel && !r.mail && !r.not && !r.unvan && !r.ulke && !r.sehir && (!r.urun||!r.urun.length); }

/* --- eksik alan denetimi --- */
function eksik(r){
  if(!r) return [];
  var out = [];
  ZORUNLU.forEach(function(z){
    var v = r[z.k];
    if(z.k==="urun"){ if(!v || !v.length) out.push(z); return; }
    var s = String(v==null?"":v).trim();
    if(!s){ out.push(z); return; }
    if(z.k==="mail" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s)) out.push({k:"mail", ad:"E-posta", bicim:true});
    if(z.k==="tel" && s.replace(/\D/g,"").length < 7) out.push({k:"tel", ad:"Telefon", bicim:true});
  });
  return out;
}
function temizleHata(){
  $("errbar").hidden = true;
  Array.prototype.forEach.call(document.querySelectorAll(".in.err"), function(el){ el.classList.remove("err"); });
  $("chips").classList.remove("mark");
  $("cins").classList.remove("mark");
  $("fair").classList.remove("err");
}
function gosterHata(m){
  temizleHata();
  var ilk = null;
  m.forEach(function(z){
    if(z.k==="urun"){ $("chips").classList.add("mark"); ilk = ilk || $("chips"); return; }
    if(z.k==="cins"){ $("cins").classList.add("mark");  ilk = ilk || $("cins");  return; }
    if(z.k==="fuar"){ $("fair").classList.add("err");   ilk = ilk || $("fair");  return; }
    var el = document.querySelector('[data-k="'+z.k+'"]');
    if(el){ el.classList.add("err"); ilk = ilk || el; }
  });
  var bicim = m.filter(function(z){ return z.bicim; });
  var bos   = m.filter(function(z){ return !z.bicim; });
  var mesaj = "";
  if(bos.length)   mesaj += "<b>Şu alanlar doldurulmalı:</b> " + bos.map(function(z){ return z.ad; }).join(", ") + ".";
  if(bicim.length) mesaj += (mesaj ? " " : "") + "<b>Geçerli değil:</b> " + bicim.map(function(z){ return z.ad; }).join(", ") + ".";
  mesaj += " Kayıt tamamlanmadan diğer kişiye geçilemez.";
  $("errbar").innerHTML = mesaj;
  $("errbar").hidden = false;
  if(ilk){
    if(ilk.scrollIntoView) ilk.scrollIntoView({block:"center", behavior:"auto"});
    if(ilk.focus && ilk.tagName !== "DIV") ilk.focus();
  }
}
/* Kayıt tamamsa true döner; değilse uyarıp false döner. */
function tamam(){
  var r = cur(); if(!r) return true;
  if(isEmpty(r) && !r.kayitli) return true;   /* hiç doldurulmamış kayıt: serbestçe çıkılır */
  var m = eksik(r);
  if(!db.fair) m = m.concat([{k:"fuar", ad:"Fuar"}]);
  if(m.length){ gosterHata(m); return false; }
  temizleHata();
  return true;
}

/* --- kaydetme --- */
function mark(){
  dirty = true;
  $("dot").className = "dot busy";
  $("savetxt").textContent = "Kaydediliyor…";
  clearTimeout(timer);
  timer = setTimeout(flush, 400);
}

/* Önce cihaza (anında, internetsiz), sonra buluta yazar. */
function flush(){
  clearTimeout(timer);
  if(!dirty && !uzakBekliyor) return;
  db.rev = Date.now();
  var yOk = yerelYaz(db);
  dirty = false;

  if(!UZAK){
    if(yOk){ uzakBekliyor = false; durum(); }
    else { uzakBekliyor = true; hata("Kaydedilemedi — cihaz hafızası dolu"); }
    return;
  }
  window.storage.set(KEY, JSON.stringify(db)).then(function(){
    uzakBekliyor = false;
    clearTimeout(tekrar);
    durum();
  }).catch(function(){
    uzakBekliyor = true;
    if(yOk) hata("Bağlantı yok — cihaza kaydedildi");
    else    hata("Kaydedilemedi");
    clearTimeout(tekrar);
    tekrar = setTimeout(flush, 5000);
  });
}
function tazele(){
  var b = $("save"), r = cur();
  if(!r){ b.disabled = true; b.className = "new done"; b.textContent = "Kaydet"; return; }
  if(!r.kayitli){                    /* henüz kaydedilmemiş: buton hep aktif, eksikleri gösterebilsin */
    b.disabled = false; b.className = "new"; b.textContent = "Kaydet";
  } else if(degisti()){
    b.disabled = false; b.className = "new"; b.textContent = "Değişikliği kaydet";
  } else {
    b.disabled = true; b.className = "new done"; b.textContent = "Kaydedildi ✓";
  }
}
function blankLike(r){ var b = blank(); b.id = r.id; b.ts = r.ts; return b; }

function kaydet(){
  var r = cur(); if(!r) return false;
  var m = eksik(r);
  if(!db.fair) m = m.concat([{k:"fuar", ad:"Fuar"}]);
  if(m.length){ gosterHata(m); return false; }
  temizleHata();
  var yeniMi = !r.kayitli;
  var simdi = new Date().toISOString();
  if(!r.fuar) r.fuar = db.fair;          /* kayıt hangi fuarda alındıysa ona bağlanır */
  if(!r.kayitTs) r.kayitTs = simdi;     /* ilk kaydın alındığı an */
  r.guncelTs = simdi;                    /* her düzenlemede tazelenir */
  r.kayitli = true;
  damgala(); mark(); flush(); tazele();
  anasayfa((r.ad || "Kayıt") + (yeniMi ? " kaydedildi." : " güncellendi."));
  return true;
}

function hata(t){ isaret("dot err", t); }

function durum(){
  if(uzakBekliyor) return;
  isaret("dot", "Kayıtlı");
}
function isaret(cls, t){
  ["dot","dot2"].forEach(function(i){ var e=$(i); if(e) e.className = cls; });
  ["savetxt","savetxt2"].forEach(function(i){ var e=$(i); if(e) e.textContent = t; });
}

/* Kapatma / yenileme koruması */
window.addEventListener("beforeunload", function(e){
  flush();
  if(dirty || uzakBekliyor){ e.preventDefault(); e.returnValue = ""; return ""; }
});
window.addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", function(){ if(document.hidden) flush(); });
window.addEventListener("online", function(){ if(uzakBekliyor) flush(); });
/* alandan çıkınca beklemeden kaydet */
document.addEventListener("blur", function(e){
  if(e.target && e.target.dataset && e.target.dataset.k) flush();
}, true);

/* --- tarih damgası: yeni kayıtta canlı saat, kayıtlıda kayıt anı --- */
var saatTimer = null;
function damga(){
  var r = cur(); if(!r) return;
  if(r.kayitli){
    var t = "Kayıt: " + uzunTarih(r.kayitTs || r.ts);
    if(r.guncelTs && r.guncelTs !== r.kayitTs) t += "  ·  Güncelleme: " + saatStr(r.guncelTs);
    $("stamp").textContent = t;
  } else {
    $("stamp").textContent = uzunTarih(new Date().toISOString());
  }
}
function saatBasla(){
  clearInterval(saatTimer);
  saatTimer = setInterval(function(){ if(EKRAN === "form"){ var r = cur(); if(r && !r.kayitli) damga(); } }, 20000);
}

/* --- ekran yönetimi --- */
var EKRAN = "home";
function ekran(n){
  EKRAN = n;
  ["home","form","listscreen"].forEach(function(i){ $(i).classList.toggle("on", i===n); });
  $("back").hidden = (n === "home");
  document.body.classList.toggle("hasbar", n !== "home");
  if(window.scrollTo) window.scrollTo(0,0);
}

function homeSay(){
  var n = db.records.length;
  var bu = db.fair ? db.records.filter(function(r){ return (r.fuar||"") === db.fair; }).length : 0;
  $("tlistsub").textContent = !n ? "Henüz kayıt yok"
    : (db.fair ? (bu + " kayıt · " + db.fair + (n > bu ? "  (toplam " + n + ")" : ""))
               : (n + " kayıt"));
}
function anasayfa(mesaj){
  flush();
  homeSay();
  var t = $("toast");
  if(mesaj){ t.textContent = mesaj; t.hidden = false; }
  else { t.hidden = true; }
  if(!uzakBekliyor) isaret("dot", db.records.length ? db.records.length + " kayıt kayıtlı" : "Hazır");
  ekran("home");
}

/* --- çizim --- */
function ulkeKur(){
  var s = $("ulke");
  ULKELER.forEach(function(u){
    var o = document.createElement("option"); o.value = u; o.textContent = u; s.appendChild(o);
  });
}
function ulkeYaz(v){
  var s = $("ulke");
  if(v && !Array.prototype.some.call(s.options, function(o){ return o.value === v; })){
    var o = document.createElement("option"); o.value = v; o.textContent = v; s.appendChild(o);
  }
  s.value = v || "";
}

function chips(){
  var box = $("chips"); box.innerHTML = "";
  URUNLER.forEach(function(u){
    var b = document.createElement("button");
    b.type="button"; b.className="chip"; b.textContent=u; b.setAttribute("aria-pressed","false");
    b.onclick = function(){
      var r = cur(); if(!r) return;
      var i = r.urun.indexOf(u);
      if(i<0) r.urun.push(u); else r.urun.splice(i,1);
      b.setAttribute("aria-pressed", i<0 ? "true" : "false");
      if(r.urun.length) $("chips").classList.remove("mark");
      if(!$("errbar").hidden && !eksik(r).length) temizleHata();
      mark(); tazele();
    };
    box.appendChild(b);
  });
}

function paint(){
  var r = cur(); if(!r) return;
  $("stitle").textContent = r.kayitli ? "Kaydı düzenle" : "Yeni kişi";
  $("del").style.display = r.kayitli ? "" : "none";

  ["ad","firma","unvan","sehir","tel","mail","not"].forEach(function(k){
    var el = document.querySelector('[data-k="'+k+'"]');
    if(el && el.value !== (r[k]||"")) el.value = r[k]||"";
  });
  ulkeYaz(r.ulke);
  Array.prototype.forEach.call($("chips").children, function(b){
    b.setAttribute("aria-pressed", r.urun.indexOf(b.textContent)>=0 ? "true":"false");
  });
  Array.prototype.forEach.call($("cins").children, function(b){
    b.setAttribute("aria-pressed", r.cins===b.dataset.c ? "true":"false");
  });

  damga();
  dupe(r);
  durum();
  tazele();
}

function norm(s){ return (s||"").replace(/[^0-9a-zA-ZğüşıöçĞÜŞİÖÇ@.]/g,"").toLowerCase(); }
function dupe(r){
  var w = $("dupe"), hit = -1;
  if(norm(r.tel).length>5 || norm(r.mail).length>5){
    db.records.forEach(function(o,i){
      if(o.id===r.id || hit>=0) return;
      if((o.fuar||"") !== (r.fuar||"")) return;   /* farklı fuar, ayrı ziyaret sayılır */
      if(norm(r.tel).length>5 && norm(o.tel)===norm(r.tel)) hit=i;
      else if(norm(r.mail).length>5 && norm(o.mail)===norm(r.mail)) hit=i;
    });
  }
  if(hit<0){ w.hidden = true; return; }
  w.hidden = false;
  w.textContent = "Bu iletişim bilgisi " + (hit+1) + ". kayıtta da var" + (db.records[hit].ad ? " (" + db.records[hit].ad + ")" : "") + ".";
}

/* --- gezinme --- */
function ac(i){                       /* listeden bir kaydı aç */
  idx = i; temizleHata(); damgala(); paint(); tazele(); ekran("form");
}
function yeni(){
  if(!db.fair){
    $("fair").classList.add("err");
    $("fair").focus();
    return;
  }
  db.records.push(blank());
  idx = db.records.length-1;
  temizleHata(); damgala(); mark(); paint(); tazele(); ekran("form"); saatBasla();
  document.querySelector('[data-k="ad"]').focus();
}
/* Formdan çıkış. Boş kayıt atılır, dolu ama kaydedilmemiş kayıt onay ister. */
function cikis(){
  var r = cur();
  if(r && !r.kayitli && isEmpty(r)){ db.records.splice(idx,1); idx = -1; mark(); flush(); anasayfa(); return; }
  if(r && degisti()){
    if(!confirm("Kaydedilmemiş değişiklikler var. Kaydetmeden çıkarsanız bu bilgiler kaybolur. Yine de çıkılsın mı?")) return;
    if(!r.kayitli){ db.records.splice(idx,1); idx = -1; }
    else { try{ db.records[idx] = JSON.parse(snap); }catch(e){} }
    mark(); flush();
  }
  temizleHata(); anasayfa();
}

/* --- liste --- */
var filtre = "";                       /* "" = seçili fuar, "__hepsi" = tümü */

function fuarlariSay(){
  var m = {}, sira = [];
  db.records.forEach(function(r){
    var f = r.fuar || "(fuarsız)";
    if(!(f in m)){ m[f] = 0; sira.push(f); }
    m[f]++;
  });
  return { say:m, sira:sira };
}
function filtreKur(){
  var s = $("ffilter"), o = fuarlariSay();
  var sec = filtre || db.fair || "__hepsi";
  s.innerHTML = "";
  o.sira.forEach(function(f){
    var e = document.createElement("option");
    e.value = f; e.textContent = f + " (" + o.say[f] + ")";
    s.appendChild(e);
  });
  if(db.fair && o.sira.indexOf(db.fair) < 0){
    var e0 = document.createElement("option");
    e0.value = db.fair; e0.textContent = db.fair + " (0)";
    s.insertBefore(e0, s.firstChild);
  }
  var t = document.createElement("option");
  t.value = "__hepsi"; t.textContent = "Tüm fuarlar (" + db.records.length + ")";
  s.appendChild(t);
  if(!Array.prototype.some.call(s.options, function(x){ return x.value === sec; })) sec = "__hepsi";
  s.value = sec; filtre = sec;
}
function filtreliKayitlar(){
  if(filtre === "__hepsi") return db.records.map(function(r,i){ return {r:r, i:i}; });
  return db.records.map(function(r,i){ return {r:r, i:i}; })
    .filter(function(x){ return (x.r.fuar || "(fuarsız)") === filtre; });
}

function list(){
  filtreKur();
  var q = norm($("q").value), box = $("plist");
  box.innerHTML = "";
  var kume = filtreliKayitlar();
  var eksikSay = 0, gorunen = 0, sonFuar = null;
  kume.forEach(function(x){ if(eksik(x.r).length) eksikSay++; });
  $("s1").textContent = kume.length;
  $("s2").hidden = !eksikSay;
  $("s2").textContent = eksikSay + " kayıt eksik";
  $("s3").textContent = (filtre === "__hepsi") ? "Tüm fuarlar" : filtre;

  kume.forEach(function(x){
    var r = x.r, i = x.i;
    var hay = norm(r.ad + r.firma + r.ulke + r.sehir + r.tel + r.mail);
    if(q && hay.indexOf(q)<0) return;
    gorunen++;

    if(filtre === "__hepsi"){
      var f = r.fuar || "(fuarsız)";
      if(f !== sonFuar){
        sonFuar = f;
        var gh = document.createElement("div");
        gh.className = "ghead"; gh.textContent = f;
        box.appendChild(gh);
      }
    }

    var row = document.createElement("div");
    row.className = "row" + (i===idx ? " cur" : "");
    row.setAttribute("role","button");
    row.tabIndex = 0;

    var num = document.createElement("span");
    num.className = "num"; num.textContent = (i+1);

    var who = document.createElement("span");
    who.className = "who";
    var nm = document.createElement("b");
    nm.textContent = r.ad || "İsimsiz kayıt";
    var mt = document.createElement("span");
    mt.textContent = [r.firma, [r.sehir, r.ulke].filter(Boolean).join(", "), r.tel].filter(Boolean).join(" · ") || "—";
    var zt = document.createElement("span");
    zt.className = "when";
    zt.textContent = tarihStr(r.kayitTs || r.ts) + " · " + saatStr(r.kayitTs || r.ts);
    who.appendChild(zt);
    who.appendChild(nm); who.appendChild(mt);

    row.appendChild(num); row.appendChild(who);

    var ek = eksik(r).length;
    if(ek){
      var t = document.createElement("span");
      t.className = "tag e"; t.textContent = ek + " eksik";
      row.appendChild(t);
    }

    var d = document.createElement("button");
    d.className = "rowdel"; d.textContent = "Sil";
    d.onclick = function(e){
      e.stopPropagation();
      if(!confirm((r.ad || (i+1)+". kayıt") + " silinecek. Emin misiniz?")) return;
      db.records.splice(i,1);
      idx = -1; damgala();
      temizleHata(); mark(); flush(); list();
    };
    row.appendChild(d);

    var git = function(){ ac(i); };
    row.onclick = git;
    row.onkeydown = function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); git(); } };
    box.appendChild(row);
  });

  if(!gorunen) box.innerHTML = '<div class="del">'+(db.records.length ? "Bu fuarda eşleşen kayıt yok." : "Henüz kayıt yok.")+'</div>';
}

/* --- dışa aktar --- */
function csv(){
  flush();
  var kume = filtreliKayitlar().map(function(x){ return x.r; });
  if(!kume.length){ alert("Aktarılacak kayıt yok."); return; }
  var ek = kume.filter(function(r){ return eksik(r).length; }).length;
  if(ek && !confirm(ek + " kayıtta eksik alan var. Yine de aktarılsın mı?")) return;
  var head = ["#","Kayıt Tarihi","Kayıt Saati","Son Güncelleme","Fuar","Ad Soyad","Cinsiyet","Firma","Görev","Ülke","Şehir","Telefon","E-posta","İlgilendiği Ürünler","Notlar"];
  var q = function(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; };
  var rows = kume.map(function(r,i){
    var kt = r.kayitTs || r.ts;
    return [i+1, tarihStr(kt), saatStr(kt), (r.guncelTs && r.guncelTs !== r.kayitTs) ? (tarihStr(r.guncelTs)+" "+saatStr(r.guncelTs)) : "", r.fuar || db.fair, r.ad, r.cins, r.firma, r.unvan, r.ulke, r.sehir, r.tel, r.mail, (r.urun||[]).join(", "), (r.not||"").replace(/\n/g," ")].map(q).join(";");
  });
  var out = "\uFEFF" + head.map(q).join(";") + "\r\n" + rows.join("\r\n");
  var etiket = (filtre === "__hepsi") ? "tum-fuarlar" : filtre;
  var name = "ORLEX-" + (etiket ? etiket.replace(/[^\wğüşıöçĞÜŞİÖÇ -]/g,"").trim().replace(/\s+/g,"-") : "fuar") + "-" + new Date().toISOString().slice(0,10) + ".csv";
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type:"text/csv;charset=utf-8"}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

document.addEventListener("input", function(e){
  var k = e.target.dataset && e.target.dataset.k;
  if(!k) return;
  var r = cur(); if(!r) return;
  r[k] = e.target.value;
  e.target.classList.remove("err");
  if(k==="tel"||k==="mail") dupe(r);
  if(!$("errbar").hidden && !eksik(r).length) temizleHata();
  mark(); tazele();
});
function fuarKur(){
  var s = $("fair");
  FUARLAR.forEach(function(f){
    var o = document.createElement("option"); o.value = f; o.textContent = f; s.appendChild(o);
  });
  var o = document.createElement("option"); o.value = "__d"; o.textContent = "Diğer — yazarak girin"; s.appendChild(o);
}
function fuarSec(v){
  var s = $("fair"), t = $("fairother");
  var bilinen = FUARLAR.indexOf(v) >= 0;
  if(v && !bilinen){ s.value = "__d"; t.hidden = false; t.value = v; }
  else { s.value = v || ""; t.hidden = true; t.value = ""; }
}
$("fair").addEventListener("change", function(){
  var v = $("fair").value;
  if(v === "__d"){ $("fairother").hidden = false; $("fairother").focus(); db.fair = $("fairother").value.trim(); }
  else { $("fairother").hidden = true; $("fairother").value = ""; db.fair = v; }
  if(db.fair) $("fair").classList.remove("err");
  mark(); homeSay(); $("toast").hidden = true;
});
$("fairother").addEventListener("input", function(){
  db.fair = $("fairother").value.trim();
  if(db.fair) $("fair").classList.remove("err");
  mark(); homeSay();
});
$("ulke").addEventListener("change", function(){
  var r = cur(); if(!r) return;
  r.ulke = $("ulke").value;
  $("ulke").classList.remove("err");
  if(!$("errbar").hidden && !eksik(r).length) temizleHata();
  mark(); tazele();
});
$("cins").addEventListener("click", function(e){
  var b = e.target.closest("button[data-c]"); if(!b) return;
  var r = cur(); if(!r) return;
  r.cins = (r.cins === b.dataset.c) ? "" : b.dataset.c;
  Array.prototype.forEach.call($("cins").children, function(x){ x.setAttribute("aria-pressed", r.cins===x.dataset.c ? "true":"false"); });
  if(r.cins) $("cins").classList.remove("mark");
  if(!$("errbar").hidden && !eksik(r).length && db.fair) temizleHata();
  mark();
});
$("save").onclick  = kaydet;
$("tnew").onclick  = yeni;
$("tlist").onclick = function(){ $("q").value=""; filtre = db.fair || "__hepsi"; list(); ekran("listscreen"); };
$("ffilter").onchange = function(){ filtre = $("ffilter").value; list(); };
$("back").onclick  = function(){ if(EKRAN === "form") cikis(); else anasayfa(); };
$("q").oninput     = list;
$("csv").onclick   = csv;
$("del").onclick = function(){
  var r = cur(); if(!r) return;
  if(!confirm((r.ad || "Bu kayıt") + " silinecek. Emin misiniz?")) return;
  db.records.splice(idx,1);
  idx = -1; temizleHata(); damgala(); mark(); flush();
  anasayfa("Kayıt silindi.");
};
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && EKRAN !== "home"){
    if(EKRAN === "form") cikis(); else anasayfa();
  }
});

uzakOku().then(function(u){
